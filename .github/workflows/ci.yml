name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Non-A11y)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests except a11y
        run: pytest -q -m "not a11y"

  ui-accessibility:
    name: UI Accessibility
    runs-on: windows-latest
    needs: test
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run UI accessibility smoke tests
        run: pytest -q -m a11y tests/test_ui_accessibility_smoke.py
